<svg width="1200" height="90" viewBox="0 0 1200 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="90" rx="18" fill="#0D1117"/>
  <path d="M0 70H1200" stroke="#30363D" stroke-width="2" stroke-dasharray="8 10"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="-100 0" to="1300 0" dur="7s" repeatCount="indefinite"/>

    <!-- thread -->
    <line x1="55" y1="8" x2="55" y2="32" stroke="#8B949E" stroke-width="2"/>

    <!-- legs left -->
    <path d="M45 46 C30 38 22 34 12 28" stroke="#F0F6FC" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 52 C28 52 20 54 8 60" stroke="#F0F6FC" stroke-width="4" stroke-linecap="round"/>
    <path d="M47 57 C34 66 26 72 16 80" stroke="#F0F6FC" stroke-width="4" stroke-linecap="round"/>

    <!-- legs right -->
    <path d="M65 46 C80 38 88 34 98 28" stroke="#F0F6FC" stroke-width="4" stroke-linecap="round"/>
    <path d="M66 52 C82 52 90 54 102 60" stroke="#F0F6FC" stroke-width="4" stroke-linecap="round"/>
    <path d="M63 57 C76 66 84 72 94 80" stroke="#F0F6FC" stroke-width="4" stroke-linecap="round"/>

    <!-- body -->
    <ellipse cx="55" cy="53" rx="20" ry="16" fill="#F0F6FC"/>
    <circle cx="55" cy="37" r="12" fill="#F0F6FC"/>

    <!-- eyes -->
    <circle cx="50" cy="35" r="2.3" fill="#0D1117"/>
    <circle cx="60" cy="35" r="2.3" fill="#0D1117"/>

    <!-- small shine -->
    <circle cx="47" cy="48" r="3" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <text x="600" y="35" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#8B949E">
    coding • building • learning
  </text>
</svg>
