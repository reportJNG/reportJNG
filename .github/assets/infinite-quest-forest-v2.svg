<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1200" y2="420">
      <stop offset="0%" stop-color="#010B07"/>
      <stop offset="42%" stop-color="#06351F"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="260" x2="1200" y2="420">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="45%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
