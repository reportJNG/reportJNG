    <style>
      .crisp{shape-rendering:crispEdges}.cloud-a{animation:cloudA 26s linear infinite}.cloud-b{animation:cloudB 34s linear infinite}.hill-a{animation:hillA 18s linear infinite}.hill-b{animation:hillB 28s linear infinite}.tree-a{animation:treeA 14s linear infinite}.tree-b{animation:treeB 20s linear infinite}.grass-line{animation:grassRun 4s linear infinite}.hero{animation:heroBob .45s ease-in-out infinite alternate;transform-origin:230px 285px}.leg-a{animation:legA .5s ease-in-out infinite alternate;transform-origin:218px 302px}.leg-b{animation:legB .5s ease-in-out infinite alternate;transform-origin:246px 302px}.arm{animation:armRun .55s ease-in-out infinite alternate;transform-origin:260px 238px}.sword{animation:swordCut 1.35s cubic-bezier(.45,0,.2,1) infinite;transform-origin:282px 226px}.slash{animation:slashCut 1.35s cubic-bezier(.45,0,.2,1) infinite;transform-origin:360px 220px}.enemy-one{animation:enemyOne 3.6s linear infinite}.enemy-two{animation:enemyTwo 4.8s linear infinite}.enemy-three{animation:enemyThree 5.8s linear infinite}.coin{animation:coinSpin 1.2s ease-in-out infinite;transform-origin:center}.coin2{animation-delay:.25s}.coin3{animation-delay:.5s}.hit{animation:hitBurst 1.35s ease-in-out infinite;transform-origin:385px 222px}.score{animation:scorePulse 1.1s ease-in-out infinite;transform-origin:160px 70px}.star{animation:twinkle 1.8s ease-in-out infinite}.star2{animation-delay:.5s}.star3{animation-delay:1s}@keyframes cloudA{from{transform:translateX(-240px)}to{transform:translateX(1260px)}}@keyframes cloudB{from{transform:translateX(1240px)}to{transform:translateX(-330px)}}@keyframes hillA{from{transform:translateX(0)}to{transform:translateX(-220px)}}@keyframes hillB{from{transform:translateX(0)}to{transform:translateX(-320px)}}@keyframes treeA{from{transform:translateX(0)}to{transform:translateX(-360px)}}@keyframes treeB{from{transform:translateX(0)}to{transform:translateX(-520px)}}@keyframes grassRun{from{stroke-dashoffset:0}to{stroke-dashoffset:-180}}@keyframes heroBob{from{transform:translateY(0)}to{transform:translateY(-7px)}}@keyframes legA{from{transform:rotate(8deg)}to{transform:rotate(-16deg)}}@keyframes legB{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}@keyframes armRun{from{transform:rotate(-8deg)}to{transform:rotate(7deg)}}@keyframes swordCut{0%,100%{transform:rotate(-25deg)}38%{transform:rotate(-25deg)}52%{transform:rotate(36deg)}68%{transform:rotate(8deg)}}@keyframes slashCut{0%,35%,100%{opacity:0;transform:scaleX(.35) rotate(-8deg)}48%{opacity:1;transform:scaleX(1.1) rotate(-8deg)}62%{opacity:0;transform:scaleX(1.35) rotate(-8deg)}}@keyframes enemyOne{0%{transform:translateX(860px);opacity:1}58%{transform:translateX(120px);opacity:1}66%{transform:translateX(92px) scale(1.28);opacity:0}100%{transform:translateX(-250px);opacity:0}}@keyframes enemyTwo{0%,25%{transform:translateX(950px);opacity:0}30%{opacity:1}68%{transform:translateX(120px);opacity:1}76%{transform:translateX(94px) scale(1.28);opacity:0}100%{transform:translateX(-250px);opacity:0}}@keyframes enemyThree{0%,45%{transform:translateX(960px);opacity:0}50%{opacity:1}80%{transform:translateX(120px);opacity:1}88%{transform:translateX(94px) scale(1.28);opacity:0}100%{transform:translateX(-250px);opacity:0}}@keyframes coinSpin{0%,100%{transform:translateY(0) scaleX(1)}50%{transform:translateY(-12px) scaleX(.35)}}@keyframes hitBurst{0%,37%,100%{opacity:0;transform:scale(.4) rotate(0deg)}48%{opacity:1;transform:scale(1.05) rotate(16deg)}62%{opacity:0;transform:scale(1.8) rotate(32deg)}}@keyframes scorePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
    </style>
