    <style>
      .crisp{shape-rendering:crispEdges}.embers{animation:embers 5s linear infinite}.embers2{animation:embers 7s linear infinite reverse}.torcha{animation:flame .8s ease-in-out infinite alternate;transform-origin:center}.torchb{animation:flame .7s ease-in-out infinite alternate;transform-origin:center}.boss{animation:bossIdle 1.55s ease-in-out infinite alternate;transform-origin:865px 260px}.boss-hit{animation:bossHit 1.6s ease-in-out infinite;transform-origin:865px 250px}.eye{animation:eyeGlow 1s ease-in-out infinite alternate}.hero{animation:heroCharge 1.6s cubic-bezier(.45,0,.2,1) infinite;transform-origin:295px 300px}.cape{animation:capeWave .6s ease-in-out infinite alternate;transform-origin:245px 250px}.sword{animation:swordStrike 1.6s cubic-bezier(.45,0,.2,1) infinite;transform-origin:345px 230px}.arc{animation:arcStrike 1.6s cubic-bezier(.45,0,.2,1) infinite;transform-origin:535px 230px}.shock{animation:shockWave 1.6s ease-in-out infinite;transform-origin:700px 300px}.orb{animation:orbMove 2.6s linear infinite}.orb2{animation-delay:.8s}.orb3{animation-delay:1.45s}.heart{animation:heartBeat 1s ease-in-out infinite}.score{animation:scorePulse 1.15s ease-in-out infinite;transform-origin:165px 70px}.rune{animation:runeSpin 8s linear infinite;transform-origin:center}@keyframes embers{from{transform:translateY(40px);opacity:.1}50%{opacity:.8}to{transform:translateY(-260px);opacity:0}}@keyframes flame{from{transform:scale(.92) translateY(2px);opacity:.82}to{transform:scale(1.12) translateY(-4px);opacity:1}}@keyframes bossIdle{from{transform:translateY(0)}to{transform:translateY(-10px)}}@keyframes bossHit{0%,55%,100%{filter:none}62%{filter:url(#bossGlow);transform:translateX(-8px) scale(1.03)}70%{transform:translateX(6px) scale(1)}}@keyframes eyeGlow{from{opacity:.65}to{opacity:1}}@keyframes heroCharge{0%,100%{transform:translateX(0) translateY(0)}38%{transform:translateX(0) translateY(0)}52%{transform:translateX(58px) translateY(-18px)}66%{transform:translateX(28px) translateY(0)}}@keyframes capeWave{from{transform:skewX(5deg)}to{transform:skewX(-10deg)}}@keyframes swordStrike{0%,100%{transform:rotate(-30deg)}40%{transform:rotate(-30deg)}54%{transform:rotate(42deg)}70%{transform:rotate(6deg)}}@keyframes arcStrike{0%,38%,100%{opacity:0;transform:scaleX(.35) rotate(-5deg)}52%{opacity:1;transform:scaleX(1.12) rotate(-5deg)}68%{opacity:0;transform:scaleX(1.35) rotate(-5deg)}}@keyframes shockWave{0%,50%,100%{opacity:0;transform:scale(.2)}62%{opacity:.75;transform:scale(1)}78%{opacity:0;transform:scale(1.7)}}@keyframes orbMove{0%{transform:translateX(0);opacity:0}15%{opacity:1}100%{transform:translateX(-700px);opacity:0}}@keyframes heartBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes scorePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}@keyframes runeSpin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
